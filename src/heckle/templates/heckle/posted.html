{% extends "heckle/page.html" %}{% load static %}
{% block heckle_title %}Your comment{% endblock %}
{% block heckle_content %}
<link rel="stylesheet" href="{% static 'heckle/heckle.css' %}">
<div class="heckle">
  <h1>Your comment was not posted</h1>
  <form class="heckle-form" method="post" action="{% url 'heckle:post' %}" novalidate>
    {% csrf_token %}
    {% include "heckle/_fields.html" %}
  </form>
  {% if target_url %}<p><a href="{{ target_url }}">Back to the page</a></p>{% endif %}
</div>
{% endblock %}
